name: Build & Auto-Sign APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Download Kokoro 82M Model
      run: |
        echo "📥 Downloading Kokoro 82M ONNX model..."
        chmod +x download_model.sh
        ./download_model.sh
        echo "✅ Model download complete!"
        
    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build APK
      run: ./gradlew assembleRelease
      
    - name: Generate Keystore & Sign APK
      run: |
        echo "🔐 Generating temporary keystore..."
        
        # Generate keystore
        keytool -genkey -v -keystore release-key.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias key0 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
        
        echo "✅ Keystore generated"
        
        # Find the unsigned APK
        UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-release-unsigned.apk" | head -n 1)
        
        if [ -z "$UNSIGNED_APK" ]; then
          echo "❌ Unsigned APK not found!"
          exit 1
        fi
        
        echo "📦 Found unsigned APK: $UNSIGNED_APK"
        
        # Use pre-installed Android Build Tools from ubuntu-latest
        BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
        
        # Align APK with zipalign
        echo "🔧 Aligning APK..."
        $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk
        
        # Sign with apksigner
        echo "✍️ Signing APK..."
        $BUILD_TOOLS/apksigner sign \
          --ks release-key.jks \
          --ks-key-alias key0 \
          --ks-pass pass:android \
          --key-pass pass:android \
          --out BibleTTS-Signed.apk \
          app-aligned.apk
        
        echo "✅ APK signed successfully!"
        
        # Verify signature
        $BUILD_TOOLS/apksigner verify BibleTTS-Signed.apk
        echo "✅ Signature verified!"
        
    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: BibleTTS-Release
        path: BibleTTS-Signed.apk
        retention-days: 30
        
    - name: Upload Keystore (Optional)
      uses: actions/upload-artifact@v4
      with:
        name: Keystore
        path: release-key.jks
        retention-days: 7
