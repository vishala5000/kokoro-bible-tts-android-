name: Build & Auto-Sign APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Download Kokoro 82M Model
      run: |
        echo "📥 Downloading Kokoro 82M ONNX model..."
        chmod +x download_model.sh
        ./download_model.sh
        echo "✅ Model download complete!"
        
    - name: Auto-Generate Gradle Wrapper
      run: |
        echo "⚙️ Auto-generating official Gradle Wrapper files..."
        mkdir -p gradle/wrapper
        
        curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradlew -o gradlew
        curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradlew.bat -o gradlew.bat
        curl -sSL https://raw.githubusercontent.com/gradle/gradle/v8.0.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        
        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.0-bin.zip
        networkTimeout=10000
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF
        
        chmod +x gradlew
        echo "✅ Gradle Wrapper generated successfully!"

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Build APK
      run: ./gradlew assembleRelease
      
    - name: Generate Keystore & Sign APK
      run: |
        echo "🔐 Generating temporary keystore..."
        
        keytool -genkey -v -keystore release-key.jks \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -alias key0 \
          -storepass android \
          -keypass android \
          -dname "CN=Android Debug,O=Android,C=US"
        
        echo "✅ Keystore generated"
        
        UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*-release-unsigned.apk" | head -n 1)
        
        if [ -z "$UNSIGNED_APK" ]; then
          echo "❌ Unsigned APK not found!"
          exit 1
        fi
        
        echo "📦 Found unsigned APK: $UNSIGNED_APK"
        
        BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
        
        echo "🔧 Aligning APK..."
        $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" app-aligned.apk
        
        echo "✍️ Signing APK..."
        $BUILD_TOOLS/apksigner sign \
          --ks release-key.jks \
          --ks-key-alias key0 \
          --ks-pass pass:android \
          --key-pass pass:android \
          --out BibleTTS-Signed.apk \
          app-aligned.apk
        
        echo "✅ APK signed successfully!"
        
        $BUILD_TOOLS/apksigner verify BibleTTS-Signed.apk
        echo "✅ Signature verified!"
        
    - name: Upload Signed APK
      uses: actions/upload-artifact@v4
      with:
        name: BibleTTS-Release
        path: BibleTTS-Signed.apk
        retention-days: 30
